# Local-only Dex instance for trying the poddy OIDC + RBAC flow.
# Storage is in memory: all data is lost when the container stops.
issuer: http://127.0.0.1:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  # Keep the demo short: no consent screen.
  skipApprovalScreen: true

staticClients:
  - id: poddy
    name: poddy
    secret: poddy-secret
    redirectURIs:
      - http://127.0.0.1:8090/oidc/callback

enablePasswordDB: true
staticPasswords:
  # admin@example.com / admin
  - email: admin@example.com
    hash: "$2a$10$RBpPsn8KzP/6uhNTwpv6gus..i.XfWcIGPBVAevVm/2hudgopagfe"
    username: admin
    userID: "1"
    groups:
      - admins
