apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  namespace: poddy-system
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: poddy-demo
data:
  config.yaml: |
    issuer: http://__DEMO_HOST__:30556/dex

    storage:
      type: memory

    web:
      http: 0.0.0.0:5556

    oauth2:
      skipApprovalScreen: true

    staticClients:
      - id: poddy
        name: poddy
        secret: poddy-secret
        redirectURIs:
          - http://__DEMO_HOST__:30081/oidc/callback

    enablePasswordDB: true
    staticPasswords:
