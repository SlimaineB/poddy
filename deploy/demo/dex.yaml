apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: poddy-system
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: poddy-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dex
        app.kubernetes.io/part-of: poddy-demo
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.45.0
          imagePullPolicy: IfNotPresent
          command: ["dex", "serve", "/etc/dex/config.yaml"]
          ports:
            - name: http
              containerPort: 5556
          readinessProbe:
            httpGet:
              path: /dex/.well-known/openid-configuration
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /dex/.well-known/openid-configuration
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dex-config
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: poddy-system
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: poddy-demo
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: dex
  ports:
    - name: http
      port: 5556
      targetPort: http
      nodePort: 30556
