apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: poddy-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: poddy-system
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/part-of: poddy-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea
        app.kubernetes.io/part-of: poddy-demo
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: gitea
          image: docker.io/gitea/gitea:1.24.6
          imagePullPolicy: IfNotPresent
          env:
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__database__PATH
              value: /data/gitea/gitea.db
            - name: GITEA__server__PROTOCOL
              value: http
            - name: GITEA__server__HTTP_ADDR
              value: 0.0.0.0
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            - name: GITEA__server__DOMAIN
              value: __DEMO_HOST__
            - name: GITEA__server__ROOT_URL
              value: http://__DEMO_HOST__:30300/
            - name: GITEA__server__SSH_DOMAIN
              value: __DEMO_HOST__
            - name: GITEA__server__SSH_PORT
              value: "30222"
            - name: GITEA__server__SSH_LISTEN_PORT
              value: "2222"
            - name: GITEA__server__START_SSH_SERVER
              value: "true"
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
            - name: GITEA__service__REQUIRE_SIGNIN_VIEW
              value: "false"
            - name: GITEA__oauth2__ENABLED
              value: "true"
            - name: GITEA__security__PASSWORD_COMPLEXITY
              value: "off"
            - name: GITEA__security__MIN_PASSWORD_LENGTH
              value: "8"
            - name: GITEA__repository__DEFAULT_BRANCH
              value: main
            - name: GITEA__cron__ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 2222
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-http
  namespace: poddy-system
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/part-of: poddy-demo
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gitea
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-ssh
  namespace: poddy-system
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/part-of: poddy-demo
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gitea
  ports:
    - name: ssh
      port: 22
      targetPort: ssh
      nodePort: 30222
