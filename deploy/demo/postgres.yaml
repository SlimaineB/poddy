apiVersion: v1
kind: Service
metadata:
  name: poddy-postgres
  namespace: poddy-system
  labels:
    app.kubernetes.io/name: poddy-postgres
    app.kubernetes.io/part-of: poddy-demo
spec:
  selector:
    app.kubernetes.io/name: poddy-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: poddy-postgres
  namespace: poddy-system
  labels:
    app.kubernetes.io/name: poddy-postgres
    app.kubernetes.io/part-of: poddy-demo
spec:
  serviceName: poddy-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: poddy-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: poddy-postgres
        app.kubernetes.io/part-of: poddy-demo
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: poddy
            - name: POSTGRES_DB
              value: poddy
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poddy-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "poddy", "-d", "poddy"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "poddy", "-d", "poddy"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
