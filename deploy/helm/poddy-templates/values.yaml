nameOverride: ""
fullnameOverride: ""

# Namespace where the template ConfigMaps are created. Defaults to the release
# namespace. Set this to the portal's workspaceNamespace when the portal and
# this chart are installed in different namespaces.
namespace: ""

# Deploy the default base, go, node and python templates as ConfigMaps. The
# portal does not embed templates, so this chart is what provides the defaults.
# Disable this only when you manage every template yourself. Defining a default
# template under templates below overrides it and takes precedence.
builtins:
  enabled: true

# One ConfigMap is created per template version. The map key is the template
# name and must match name in template.yaml. The portal discovers these
# ConfigMaps through the poddy.io/template=true label, so they can be applied at
# any time.
#
# Versioned template (multiple versions kept for rollback):
# templates:
#   node:
#     active: "2.0.0"
#     versions:
#       "1.0.0":
#         template: |
#           name: node
#           displayName: Node.js
#           image: ghcr.io/your-org/poddy-workspace-node:1
#           parameters:
#             - name: cpu
#               default: "1"
#         pod: |
#           apiVersion: v1
#           kind: Pod
#           spec: {}
#       "2.0.0":
#         template: |
#           name: node
#           displayName: Node.js
#           image: ghcr.io/your-org/poddy-workspace-node:2
#         pod: |
#           apiVersion: v1
#           kind: Pod
#           spec:
#             containers:
#               - name: workspace
#                 env:
#                   - name: NODE_ENV
#                     value: production
#
# Unversioned template (backward compatible, one ConfigMap):
# templates:
#   node:
#     template: |
#       name: node
#       image: ghcr.io/your-org/poddy-workspace-node:latest
#     pod: |
#       apiVersion: v1
#       kind: Pod
#       spec: {}
templates: {}
