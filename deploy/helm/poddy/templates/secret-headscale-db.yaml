{{- if and (include "poddy.headscaleEnabled" .) (eq .Values.mesh.headscale.database.type "postgres") (not .Values.mesh.headscale.database.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "poddy.headscaleDBSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.mesh.headscale.database.postgres.passwordKey | quote }}: {{ required "mesh.headscale.database.postgres.password is required when existingSecret is empty" .Values.mesh.headscale.database.postgres.password | quote }}
{{- end }}
