{{- if and .Values.mesh.enabled (not .Values.mesh.existingSecret) }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace (include "poddy.meshSecretName" .) -}}
{{- $authKey := .Values.mesh.authKey -}}
{{- $clientKey := .Values.mesh.clientAuthKey -}}
{{- $clientKeyName := .Values.mesh.clientAuthKeyKey | default .Values.mesh.authKeyKey -}}
{{- if not $authKey -}}
{{- if $secret -}}
{{- if hasKey $secret.data .Values.mesh.authKeyKey -}}
{{- $authKey = b64dec (get $secret.data .Values.mesh.authKeyKey) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not $clientKey -}}
{{- if $secret -}}
{{- if hasKey $secret.data $clientKeyName -}}
{{- $clientKey = b64dec (get $secret.data $clientKeyName) -}}
{{- end -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "poddy.meshSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.mesh.authKeyKey }}: {{ $authKey | default "" | quote }}
  {{ $clientKeyName }}: {{ $clientKey | default "" | quote }}
{{- end }}
