{{- if and .Values.mesh.enabled (not .Values.mesh.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "poddy.meshSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.mesh.authKeyKey }}: {{ required "mesh.authKey (or mesh.existingSecret) is required when mesh.enabled=true" .Values.mesh.authKey | quote }}
{{- end }}
