{{- if and (include "poddy.headscaleEnabled" .) (gt (int .Values.mesh.headscale.replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "poddy.fullname" . }}-headscale
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "poddy.selectorLabels" . | nindent 6 }}
      poddy.io/component: headscale
{{- end }}
