apiVersion: v1
kind: Service
metadata:
  name: {{ include "poddy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
  {{- with .Values.http.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.http.service.type }}
  {{- with .Values.http.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.http.service.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  {{- with .Values.http.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.http.service.port }}
      {{- with .Values.http.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "poddy.selectorLabels" . | nindent 4 }}
    poddy.io/component: portal
