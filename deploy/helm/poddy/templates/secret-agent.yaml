{{- if and .Values.ssh.enabled .Values.ssh.agent.enabled (not .Values.ssh.agent.existingSecret) }}
{{- $secretName := include "poddy.agentSecretName" . }}
{{- $key := .Values.ssh.agent.key }}
{{- if not $key }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existing (index $existing.data "agent-key") }}
{{- $key = index $existing.data "agent-key" | b64dec }}
{{- else }}
{{- $key = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
type: Opaque
data:
  agent-key: {{ $key | b64enc | quote }}
{{- end }}
