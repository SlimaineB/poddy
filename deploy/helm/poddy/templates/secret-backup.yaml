{{- if and .Values.backup.enabled (not .Values.backup.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "poddy.backupSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.backup.s3.accessKeyKey | default "access-key" }}: {{ required "backup.s3.accessKey is required when backup.enabled=true and existingSecret is not set" .Values.backup.s3.accessKey | quote }}
  {{ .Values.backup.s3.secretKeyKey | default "secret-key" }}: {{ required "backup.s3.secretKey is required when backup.enabled=true and existingSecret is not set" .Values.backup.s3.secretKey | quote }}
{{- end }}
