{{- $metrics := default (dict) (index .Values "metrics") }}
{{- $metricsEnabled := true }}
{{- if hasKey $metrics "enabled" }}{{ $metricsEnabled = index $metrics "enabled" }}{{ end }}
{{- $serviceMonitor := default (dict) (index $metrics "serviceMonitor") }}
{{- $serviceMonitorEnabled := false }}
{{- if hasKey $serviceMonitor "enabled" }}{{ $serviceMonitorEnabled = index $serviceMonitor "enabled" }}{{ end }}
{{- $interval := default "30s" (index $serviceMonitor "interval") }}
{{- $scrapeTimeout := default "10s" (index $serviceMonitor "scrapeTimeout") }}
{{- $labels := default (dict) (index $serviceMonitor "labels") }}
{{- $relabelings := default (list) (index $serviceMonitor "relabelings") }}
{{- $metricRelabelings := default (list) (index $serviceMonitor "metricRelabelings") }}
{{- if and $metricsEnabled $serviceMonitorEnabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "poddy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
    {{- with $labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "poddy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ $interval }}
      scrapeTimeout: {{ $scrapeTimeout }}
      {{- with $relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
