{{- if and .Values.regions (not .Values.regionsExistingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "poddy.regionsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.regionsKey }}: |
    {{- dict "regions" .Values.regions | toYaml | nindent 4 }}
{{- end }}
