{{- if and .Values.ssh.enabled .Values.bastion.enabled .Values.bastion.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "poddy.fullname" . }}-bastion
  namespace: {{ include "poddy.workspaceNamespace" . }}
  labels:
    {{- include "poddy.bastion.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["get", "create"]
  # Self-service SSH public keys are stored in a ConfigMap and reloaded while
  # the bastion is running.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Workspace access approvals and presence are shared with the portal through
  # the poddy-access Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "poddy.fullname" . }}-bastion
  namespace: {{ include "poddy.workspaceNamespace" . }}
  labels:
    {{- include "poddy.bastion.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "poddy.bastion.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "poddy.fullname" . }}-bastion
  apiGroup: rbac.authorization.k8s.io
{{- end }}
