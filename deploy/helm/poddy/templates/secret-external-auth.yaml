{{- if and .Values.externalAuth.providers (not .Values.externalAuth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "poddy.externalAuthConfigSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.externalAuth.key }}
  {{ $.Values.externalAuth.keyKey }}: {{ . | quote }}
  {{- end }}
  {{- range .Values.externalAuth.providers }}
  {{- if .clientSecret }}
  provider-{{ .id }}-client-secret: {{ .clientSecret | quote }}
  {{- end }}
  {{- end }}
{{- end }}
