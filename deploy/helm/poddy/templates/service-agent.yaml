{{- if and .Values.ssh.enabled .Values.ssh.agent.enabled (not .Values.regionManager.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "poddy.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: agent
      port: {{ .Values.ssh.agent.port }}
      targetPort: agent
      protocol: TCP
  selector:
    {{- include "poddy.selectorLabels" . | nindent 4 }}
    poddy.io/component: portal
{{- end }}
