{{- if and .Values.ssh.enabled (not .Values.regionManager.enabled) (not .Values.mesh.enabled) (not .Values.ssh.existingHostKeySecret) }}
{{- $name := include "poddy.sshHostKeySecretName" . }}
{{- $key := "" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data .Values.ssh.hostKeySecretKey) }}
{{- $key = index $existing.data .Values.ssh.hostKeySecretKey }}
{{- else }}
{{- $key = genPrivateKey "ed25519" | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.ssh.hostKeySecretKey }}: {{ $key }}
{{- end }}
