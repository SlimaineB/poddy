{{- if and .Values.mesh.headscale.enabled (not .Values.mesh.headscale.storageClass) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "poddy.fullname" . }}-headscale
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mesh.headscale.storage }}
{{- else if .Values.mesh.headscale.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "poddy.fullname" . }}-headscale
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.mesh.headscale.storageClass }}
  resources:
    requests:
      storage: {{ .Values.mesh.headscale.storage }}
{{- end }}
