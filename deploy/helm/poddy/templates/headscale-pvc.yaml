{{- if and (include "poddy.headscaleEnabled" .) (not .Values.mesh.headscale.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "poddy.fullname" . }}-headscale
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.mesh.headscale.storageAccessMode | default "ReadWriteOnce" }}
  {{- with .Values.mesh.headscale.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mesh.headscale.storage }}
{{- end }}
