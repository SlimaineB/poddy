{{- $egress := .Values.monitoring.egress }}
{{- if $egress.enabled }}
{{- $image := $egress.image | default (printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion)) }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "poddy.fullname" . }}-netmon
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.netmonLabels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "poddy.netmonSelectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        {{- include "poddy.netmonLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "poddy.fullname" . }}-netmon
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 10
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $egress.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $egress.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $egress.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $egress.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: netmon
          image: {{ $image }}
          command: ["/poddy-netmon"]
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -metrics-addr=:{{ $egress.metricsPort }}
            - -namespace={{ include "poddy.workspaceNamespace" . }}
            - -node-name=$(NODE_NAME)
            - -region=$(PODDY_REGION)
            - -interface={{ $egress.interface }}
            - -endpoint-cap={{ $egress.endpointCap }}
            - -refresh={{ $egress.refresh }}
            - -mount-refresh={{ $egress.mountRefresh }}
            - -stats-interval={{ $egress.statsInterval }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PODDY_REGION
              value: {{ .Values.regionManager.name | default "local" | quote }}
          ports:
            - name: metrics
              containerPort: {{ $egress.metricsPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $egress.resources | nindent 12 }}
          securityContext:
            privileged: true
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: Unconfined
{{- end }}
