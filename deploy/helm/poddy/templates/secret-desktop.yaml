{{- if and .Values.desktop.secret (not .Values.desktop.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "poddy.desktopSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.desktop.secretKey }}: {{ .Values.desktop.secret | quote }}
{{- end }}
