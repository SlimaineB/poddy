apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "poddy.fullname" . }}-test-connection"
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget"]
      args:
        - "-qO-"
        - "http://{{ include "poddy.fullname" . }}:{{ .Values.http.service.port }}/healthz"
