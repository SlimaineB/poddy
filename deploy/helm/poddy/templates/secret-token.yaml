{{- if and (not .Values.auth.existingSecret) (not .Values.auth.token) (not .Values.oidc.enabled) }}
{{- fail "auth.token, auth.existingSecret, or oidc.enabled is required" }}
{{- end }}
{{- if and (not .Values.auth.existingSecret) .Values.auth.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "poddy.tokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey }}: {{ .Values.auth.token | quote }}
{{- end }}
