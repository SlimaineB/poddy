{{- $egress := .Values.monitoring.egress }}
{{- if $egress.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "poddy.fullname" . }}-netmon-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.netmonLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "poddy.netmonSelectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ $egress.metricsPort }}
      targetPort: metrics
      protocol: TCP
{{- end }}
