{{- if .Values.mesh.dex.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "poddy.fullname" . }}-dex
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    issuer: {{ include "poddy.dexIssuer" . | quote }}
    storage:
      type: memory
    web:
      http: 0.0.0.0:5556
    logger:
      level: info
    oauth2:
      skipApprovalScreen: true
    enablePasswordDB: true
    staticClients:
      - id: {{ .Values.mesh.headscale.oidc.clientId | quote }}
        name: Headscale
        secretEnv: HEADSCALE_OIDC_CLIENT_SECRET
        redirectURIs:
          - {{ printf "%s/oidc/callback" (include "poddy.headscaleURL" .) | quote }}
    staticPasswords:
    {{- range .Values.mesh.dex.users }}
      - email: {{ .email | quote }}
        hash: {{ if .passwordHash }}{{ .passwordHash | quote }}{{ else }}{{ bcrypt .password | quote }}{{ end }}
        username: {{ .username | default (regexReplaceAll "@.*$" .email "") | quote }}
        userID: {{ .email | quote }}
    {{- end }}
{{- end }}
