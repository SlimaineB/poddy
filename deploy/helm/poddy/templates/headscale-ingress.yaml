{{- if and (include "poddy.headscaleEnabled" .) (include "poddy.headscaleHost" .) }}
{{- $host := include "poddy.headscaleHost" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "poddy.fullname" . }}-headscale
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
  {{- with .Values.mesh.headscale.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.mesh.headscale.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.mesh.headscale.tlsSecret }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- if .Values.mesh.dex.enabled }}
          - path: /dex
            pathType: Prefix
            backend:
              service:
                name: {{ include "poddy.fullname" . }}-dex
                port:
                  number: 5556
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "poddy.fullname" . }}-headscale
                port:
                  number: 8080
{{- end }}
