{{- if and .Values.ssh.enabled .Values.bastion.enabled .Values.bastion.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "poddy.bastion.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.bastion.labels" . | nindent 4 }}
  {{- with .Values.bastion.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
