{{- if include "poddy.meshBootstrapEnabled" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "poddy.fullname" . }}-mesh-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "poddy.fullname" . }}-mesh-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "poddy.fullname" . }}-mesh-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "poddy.fullname" . }}-mesh-bootstrap
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "poddy.fullname" . }}-mesh-bootstrap
{{- end }}
