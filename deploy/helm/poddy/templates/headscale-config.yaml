{{- if include "poddy.headscaleEnabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "poddy.fullname" . }}-headscale
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
data:
  config.yaml: |
    server_url: {{ include "poddy.headscaleURL" . | quote }}
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 127.0.0.1:9090
    grpc_listen_addr: 127.0.0.1:50443
    grpc_allow_insecure: false
    private_key_path: /var/lib/headscale/private.key
    unix_socket: /var/lib/headscale/headscale.sock
    unix_socket_permission: "0770"
    noise:
      private_key_path: /var/lib/headscale/noise_private.key
    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48
    derp:
      server:
        enabled: {{ .Values.mesh.derp.embedded }}
        {{- if .Values.mesh.derp.embedded }}
        region_id: {{ .Values.mesh.derp.regionId }}
        region_code: {{ .Values.mesh.derp.regionCode | quote }}
        region_name: {{ .Values.mesh.derp.regionName | quote }}
        stun_listen_addr: {{ printf "0.0.0.0:%d" (int .Values.mesh.derp.stunPort) | quote }}
        private_key_path: /var/lib/headscale/derp_server_private.key
        automatically_add_embedded_derp_region: true
        {{- with .Values.mesh.derp.ipv4 }}
        ipv4: {{ . | quote }}
        {{- end }}
        {{- with .Values.mesh.derp.ipv6 }}
        ipv6: {{ . | quote }}
        {{- end }}
        {{- end }}
      urls: {{ toYaml .Values.mesh.derpUrls | nindent 8 }}
      paths: []
      auto_update_enabled: false
      update_frequency: 24h
    disable_check_updates: true
    ephemeral_node_inactivity_timeout: 30m
    {{- if eq .Values.mesh.headscale.database.type "postgres" }}
    database:
      type: postgres
      postgres:
        host: {{ required "mesh.headscale.database.postgres.host is required for PostgreSQL" .Values.mesh.headscale.database.postgres.host | quote }}
        port: {{ .Values.mesh.headscale.database.postgres.port }}
        name: {{ required "mesh.headscale.database.postgres.name is required for PostgreSQL" .Values.mesh.headscale.database.postgres.name | quote }}
        user: {{ required "mesh.headscale.database.postgres.user is required for PostgreSQL" .Values.mesh.headscale.database.postgres.user | quote }}
        ssl: {{ .Values.mesh.headscale.database.postgres.ssl | quote }}
        max_open_conns: {{ .Values.mesh.headscale.database.postgres.maxOpenConns }}
        max_idle_conns: {{ .Values.mesh.headscale.database.postgres.maxIdleConns }}
        conn_max_idle_time: {{ .Values.mesh.headscale.database.postgres.connMaxIdleTime | quote }}
        conn_max_lifetime: {{ .Values.mesh.headscale.database.postgres.connMaxLifetime | quote }}
    {{- else }}
    database:
      type: sqlite
      sqlite:
        path: /var/lib/headscale/db.sqlite
    {{- end }}
    log:
      level: info
    dns:
      magic_dns: true
      base_domain: poddy.mesh
      nameservers:
        global: {{ toYaml .Values.mesh.headscale.nameservers | nindent 10 }}
      search_domains: {{ toYaml .Values.mesh.headscale.searchDomains | nindent 8 }}
    policy:
      mode: database
      path: ""
    {{- if or .Values.mesh.headscale.oidc.enabled .Values.mesh.dex.enabled }}
    oidc:
      only_start_if_oidc_is_available: {{ .Values.mesh.headscale.oidc.onlyStartIfAvailable }}
      issuer: {{ include "poddy.oidcIssuer" . | quote }}
      client_id: {{ .Values.mesh.headscale.oidc.clientId | quote }}
      client_secret_path: /etc/headscale-oidc/client-secret
      {{- with .Values.mesh.headscale.oidc.expiry }}
      expiry: {{ . | quote }}
      {{- end }}
      strip_email_domain: {{ .Values.mesh.headscale.oidc.stripEmailDomain }}
      scope: {{ toYaml .Values.mesh.headscale.oidc.scopes | nindent 8 }}
      allowed_domains: {{ toYaml .Values.mesh.headscale.oidc.allowedDomains | nindent 8 }}
      allowed_groups: {{ toYaml .Values.mesh.headscale.oidc.allowedGroups | nindent 8 }}
      allowed_users: {{ toYaml .Values.mesh.headscale.oidc.allowedUsers | nindent 8 }}
    {{- end }}
{{- end }}
