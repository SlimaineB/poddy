{{- if and .Values.ssh.enabled (not .Values.ssh.ca.existingSecret) }}
{{- $secretName := include "poddy.sshCASecretName" . }}
{{- $key := .Values.ssh.ca.key }}
{{- if not $key }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existing (index $existing.data .Values.ssh.ca.keyKey) }}
{{- $key = index $existing.data .Values.ssh.ca.keyKey | b64dec }}
{{- else }}
{{- $key = genPrivateKey "ed25519" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.ssh.ca.keyKey }}: {{ $key | b64enc | quote }}
{{- end }}
