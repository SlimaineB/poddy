{{- if and .Values.ssh.enabled .Values.bastion.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "poddy.fullname" . }}-bastion
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.bastion.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.bastion.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "poddy.bastion.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "poddy.bastion.labels" . | nindent 8 }}
        {{- with .Values.bastion.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/ssh-keys: {{ include (print $.Template.BasePath "/configmap-ssh-keys.yaml") . | sha256sum }}
        checksum/ssh-ca: {{ include (print $.Template.BasePath "/secret-ssh-ca.yaml") . | sha256sum }}
        {{- if .Values.ssh.agent.enabled }}
        checksum/agent: {{ include (print $.Template.BasePath "/secret-agent.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.bastion.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "poddy.bastion.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bastion.priorityClassName | default .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bastion
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/poddy-bastion"]
          args:
            - -ssh-addr={{ .Values.ssh.addr }}
            - -namespace={{ include "poddy.workspaceNamespace" . }}
            - -editor=
            - -ssh-keys-file=/etc/poddy/authorized_keys
            - -ssh-allow-unmapped-keys={{ .Values.ssh.allowUnmappedKeys }}
            - -ssh-user-keys-configmap={{ include "poddy.fullname" . }}-user-ssh-keys
            - -ssh-require-agent={{ .Values.ssh.requireAgent }}
            {{- if and .Values.ssh.enabled .Values.ssh.agent.enabled }}
            - -agent-addr=:{{ .Values.ssh.agent.port }}
            {{- end }}
            {{- if .Values.ssh.existingHostKeySecret }}
            - -ssh-host-key=/etc/poddy/ssh/{{ .Values.ssh.hostKeySecretKey }}
            {{- else }}
            - -ssh-host-key=/tmp/poddy/ssh_host_ed25519_key
            {{- end }}
            {{- with .Values.bastion.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.database.url .Values.database.existingSecret .Values.bastion.extraEnv .Values.ssh.enabled .Values.regionManager.enabled }}
          env:
            {{- if and .Values.ssh.enabled .Values.ssh.agent.enabled }}
            - name: PODDY_AGENT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "poddy.agentSecretName" . }}
                  key: agent-key
            {{- end }}
            {{- if .Values.ssh.enabled }}
            - name: PODDY_SSH_CA_KEY_FILE
              value: /etc/poddy/ssh-ca/{{ .Values.ssh.ca.keyKey }}
            {{- end }}
            {{- if .Values.regionManager.enabled }}
            - name: PODDY_REGION_MODE
              value: "true"
            - name: PODDY_REGION_NAME
              value: {{ .Values.regionManager.name | quote }}
            - name: PODDY_REGION_HUB_URL
              value: {{ .Values.regionManager.hubUrl | quote }}
            - name: PODDY_REGION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "poddy.regionKeySecretName" . }}
                  key: {{ .Values.regionManager.keyKey }}
            {{- end }}
            {{- if or .Values.database.url .Values.database.existingSecret }}
            - name: PODDY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "poddy.databaseSecretName" . }}
                  key: {{ .Values.database.urlKey }}
            - name: PODDY_DATABASE_AUTO_MIGRATE
              value: {{ .Values.database.autoMigrate | quote }}
            - name: PODDY_DATABASE_CONNECT_TIMEOUT
              value: {{ .Values.database.connectTimeout | quote }}
            {{- end }}
            {{- with .Values.kubernetes }}
            - name: PODDY_K8S_QPS
              value: {{ .qps | quote }}
            - name: PODDY_K8S_BURST
              value: {{ .burst | quote }}
            {{- end }}
            {{- with .Values.bastion.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
            {{- if and .Values.ssh.enabled .Values.ssh.agent.enabled }}
            - name: agent
              containerPort: {{ .Values.ssh.agent.port }}
              protocol: TCP
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: ssh
            {{- toYaml .Values.bastion.probes.readiness | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: ssh
            {{- toYaml .Values.bastion.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.bastion.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: ssh-keys
              mountPath: /etc/poddy/authorized_keys
              subPath: {{ .Values.ssh.keysSecretKey }}
              readOnly: true
            {{- if .Values.ssh.existingHostKeySecret }}
            - name: ssh-host-key
              mountPath: /etc/poddy/ssh
              readOnly: true
            {{- else }}
            - name: ssh-host-key
              mountPath: /tmp/poddy
            {{- end }}
            - name: ssh-ca
              mountPath: /etc/poddy/ssh-ca
              readOnly: true
            {{- with .Values.bastion.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: ssh-keys
          {{- if .Values.ssh.existingKeysSecret }}
          secret:
            secretName: {{ .Values.ssh.existingKeysSecret }}
          {{- else }}
          configMap:
            name: {{ include "poddy.sshKeysName" . }}
          {{- end }}
        {{- if .Values.ssh.existingHostKeySecret }}
        - name: ssh-host-key
          secret:
            secretName: {{ .Values.ssh.existingHostKeySecret }}
            defaultMode: 0444
        {{- else }}
        - name: ssh-host-key
          emptyDir: {}
        {{- end }}
        - name: ssh-ca
          secret:
            secretName: {{ include "poddy.sshCASecretName" . }}
            defaultMode: 0444
        {{- with .Values.bastion.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.bastion.nodeSelector | default .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bastion.tolerations | default .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bastion.affinity | default .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.bastion.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.bastion.topologySpreadConstraints | nindent 8 }}
      {{- else if gt (int .Values.bastion.replicaCount) 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "poddy.bastion.selectorLabels" . | nindent 14 }}
      {{- end }}
{{- end }}
