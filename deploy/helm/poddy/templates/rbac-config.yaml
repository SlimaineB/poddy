{{- if and .Values.rbac.create .Values.rbac.createConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "poddy.rbacConfigMapName" . }}
  namespace: {{ include "poddy.workspaceNamespace" . }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
data:
  rbac.yaml: |
    admins:
    {{- range .Values.rbac.admins }}
      - {{ . | quote }}
    {{- end }}
    auditors:
    {{- range .Values.rbac.auditors }}
      - {{ . | quote }}
    {{- end }}
    teams:
    {{- range $name, $team := .Values.rbac.teams }}
      {{ $name }}:
        members:
        {{- range $team.members }}
          - {{ . | quote }}
        {{- end }}
        {{- with $team.quota }}
        quota:
          {{- if hasKey . "maxWorkspaces" }}
          maxWorkspaces: {{ .maxWorkspaces }}
          {{- end }}
          {{- if .cpu }}
          cpu: {{ .cpu | quote }}
          {{- end }}
          {{- if .memory }}
          memory: {{ .memory | quote }}
          {{- end }}
          {{- if .storage }}
          storage: {{ .storage | quote }}
          {{- end }}
        {{- end }}
    {{- end }}
    userQuotas:
    {{- range $identity, $quota := .Values.rbac.userQuotas }}
      {{ $identity | quote }}:
        {{- if hasKey $quota "maxWorkspaces" }}
        maxWorkspaces: {{ $quota.maxWorkspaces }}
        {{- end }}
        {{- if $quota.cpu }}
        cpu: {{ $quota.cpu | quote }}
        {{- end }}
        {{- if $quota.memory }}
        memory: {{ $quota.memory | quote }}
        {{- end }}
        {{- if $quota.storage }}
        storage: {{ $quota.storage | quote }}
        {{- end }}
    {{- end }}
    templates:
    {{- range $name, $access := .Values.rbac.templates }}
      {{ $name }}:
        owners:
        {{- range $access.owners }}
          - {{ . | quote }}
        {{- end }}
        users:
        {{- range $access.users }}
          - {{ . | quote }}
        {{- end }}
        teams:
        {{- range $access.teams }}
          - {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
