{{- if and .Values.regionManager.enabled (not .Values.regionManager.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "poddy.regionKeySecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.regionManager.keyKey }}: {{ required "regionManager.key is required in region mode" .Values.regionManager.key | quote }}
{{- end }}
