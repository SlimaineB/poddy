{{- if and .Values.mesh.headscale.enabled (or .Values.mesh.headscale.oidc.enabled .Values.mesh.dex.enabled) (not .Values.mesh.headscale.oidc.existingSecret) }}
{{- $name := include "poddy.headscaleOIDCSecretName" . }}
{{- $key := .Values.mesh.headscale.oidc.clientSecretKey }}
{{- $secret := "" }}
{{- if .Values.mesh.headscale.oidc.clientSecret }}
{{- $secret = .Values.mesh.headscale.oidc.clientSecret }}
{{- else }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data $key) }}
{{- $secret = index $existing.data $key | b64dec }}
{{- else }}
{{- $secret = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ $secret | b64enc }}
{{- end }}
