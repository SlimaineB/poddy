{{- if include "poddy.headscaleEnabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "poddy.fullname" . }}-headscale
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
  {{- with .Values.mesh.headscale.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.mesh.headscale.service.type }}
  type: {{ . }}
  {{- end }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
      {{- with .Values.mesh.headscale.service.httpNodePort }}
      nodePort: {{ . }}
      {{- end }}
    {{- if .Values.mesh.derp.embedded }}
    - name: stun
      port: {{ .Values.mesh.derp.stunPort }}
      targetPort: stun
      protocol: UDP
      {{- with .Values.mesh.derp.service.stunNodePort }}
      nodePort: {{ . }}
      {{- end }}
    {{- end }}
  selector:
    {{- include "poddy.selectorLabels" . | nindent 4 }}
    poddy.io/component: headscale
{{- end }}
