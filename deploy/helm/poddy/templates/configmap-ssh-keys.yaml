{{- if and .Values.ssh.enabled (not .Values.ssh.existingKeysSecret) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "poddy.sshKeysName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
data:
  {{ .Values.ssh.keysSecretKey }}: |
    {{- range .Values.ssh.authorizedKeys }}
    {{ . }}
    {{- end }}
{{- end }}
