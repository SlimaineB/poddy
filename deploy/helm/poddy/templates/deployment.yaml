{{- if and .Values.ssh.enabled .Values.bastion.enabled (gt (int .Values.bastion.replicaCount) 1) (not .Values.ssh.existingHostKeySecret) }}
{{- fail "ssh.existingHostKeySecret is required when ssh.enabled=true and bastion.replicaCount > 1" }}
{{- end }}
{{- if and .Values.ssh.enabled .Values.ssh.requireAgent (not .Values.ssh.agent.enabled) }}
{{- fail "ssh.agent.enabled must be true when ssh.requireAgent=true" }}
{{- end }}
{{- if and .Values.oidc.enabled (not .Values.oidc.issuer) }}
{{- fail "oidc.issuer is required when oidc.enabled=true" }}
{{- end }}
{{- if and .Values.oidc.enabled (not .Values.oidc.existingSecret) (not .Values.oidc.clientId) }}
{{- fail "oidc.clientId is required when oidc.enabled=true and oidc.existingSecret is not set" }}
{{- end }}
{{- $metrics := default (dict) (index .Values "metrics") }}
{{- $metricsEnabled := true }}
{{- if hasKey $metrics "enabled" }}{{ $metricsEnabled = index $metrics "enabled" }}{{ end }}
{{- $metricsService := default (dict) (index $metrics "service") }}
{{- $metricsPort := default 9090 (index $metricsService "port") }}
{{- if and .Values.oidc.enabled (gt (int .Values.replicaCount) 1) (not .Values.oidc.sessionKey) (not .Values.oidc.existingSecret) }}
{{- fail "oidc.sessionKey or oidc.existingSecret is required when oidc.enabled=true and replicaCount > 1" }}
{{- end }}
{{- if .Values.externalAuth.providers }}
{{- if and (gt (int .Values.replicaCount) 1) (not .Values.externalAuth.key) (not .Values.externalAuth.existingSecret) }}
{{- fail "externalAuth.key or externalAuth.existingSecret is required when externalAuth.providers is set and replicaCount > 1" }}
{{- end }}
{{- range $i, $provider := .Values.externalAuth.providers }}
{{- if not $provider.id }}
{{- fail (printf "externalAuth.providers[%d].id is required" $i) }}
{{- end }}
{{- if not $provider.clientId }}
{{- fail (printf "externalAuth.providers[%d].clientId is required" $i) }}
{{- end }}
{{- if and (not $provider.clientSecret) (not $provider.existingSecret) (not $.Values.externalAuth.existingSecret) }}
{{- fail (printf "externalAuth.providers[%d].clientSecret or existingSecret is required" $i) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "poddy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "poddy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "poddy.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/ssh-keys: {{ include (print $.Template.BasePath "/configmap-ssh-keys.yaml") . | sha256sum }}
        {{- if .Values.regions }}
        checksum/regions: {{ include (print $.Template.BasePath "/secret-regions.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.regionManager.enabled }}
        checksum/region-key: {{ include (print $.Template.BasePath "/secret-region-key.yaml") . | sha256sum }}
        {{- end }}
        {{- if or .Values.desktop.secret .Values.desktop.existingSecret }}
        checksum/desktop: {{ include (print $.Template.BasePath "/secret-desktop.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.ssh.enabled }}
        checksum/ssh-ca: {{ include (print $.Template.BasePath "/secret-ssh-ca.yaml") . | sha256sum }}
        {{- if .Values.ssh.agent.enabled }}
        checksum/agent: {{ include (print $.Template.BasePath "/secret-agent.yaml") . | sha256sum }}
        {{- end }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "poddy.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: portal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -addr={{ .Values.portal.addr }}
            {{- if $metricsEnabled }}
            - -metrics-addr=:{{ $metricsPort }}
            {{- end }}
            - -namespace={{ include "poddy.workspaceNamespace" . }}
            - -rbac-configmap={{ include "poddy.rbacConfigMapName" . }}
            - -state-configmap={{ include "poddy.stateConfigMapName" . }}
            - -template={{ .Values.defaultTemplate }}
            - -editor=
            - -ssh-addr=
            - -ssh-enabled={{ .Values.ssh.enabled }}
            {{- if .Values.ssh.enabled }}
            - -ssh-require-agent={{ .Values.ssh.requireAgent }}
            {{- end }}
            - -ssh-user-keys-configmap={{ include "poddy.fullname" . }}-user-ssh-keys
            {{- if and .Values.ssh.enabled .Values.ssh.agent.enabled }}
            - -agent-url={{ include "poddy.agentURL" . }}
            - -agent-token-ttl={{ .Values.ssh.agent.tokenTtl }}
            {{- end }}
            {{- if .Values.regionManager.enabled }}
            - -region-mode=true
            - -region-name={{ required "regionManager.name is required when enabled" .Values.regionManager.name }}
            - -region-hub-url={{ required "regionManager.hubUrl is required when enabled" .Values.regionManager.hubUrl }}
            - -instance-id=$(PODDY_INSTANCE_ID)
            {{- end }}
            {{- if .Values.ssh.enabled }}
            - -ssh-public-host={{ required "ssh.publicHost is required when ssh.enabled=true" .Values.ssh.publicHost }}
            - -ssh-public-port={{ .Values.ssh.publicPort }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if or .Values.auth.existingSecret .Values.auth.token }}
            - name: PODDY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "poddy.tokenSecretName" . }}
                  key: {{ .Values.auth.secretKey }}
            {{- end }}
            - name: PODDY_TOKEN_ADMIN
              value: {{ .Values.auth.tokenAdmin | quote }}
            - name: PODDY_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PODDY_STORAGE_CLASS
              value: {{ .Values.workspace.storageClass | quote }}
            - name: PODDY_IMAGE_REGISTRY
              value: {{ .Values.workspace.imageRegistry | quote }}
            - name: PODDY_IMAGE_REGISTRY_MAP
              value: {{ .Values.workspace.imageRegistryMap | toJson | quote }}
            - name: PODDY_WORKSPACE_IMAGE_PULL_SECRETS
              value: {{ join "," .Values.workspace.imagePullSecrets | quote }}
            {{- if .Values.backup.enabled }}
            - name: PODDY_BACKUP_S3_ENDPOINT
              value: {{ .Values.backup.s3.endpoint | quote }}
            - name: PODDY_BACKUP_S3_REGION
              value: {{ .Values.backup.s3.region | quote }}
            - name: PODDY_BACKUP_S3_BUCKET
              value: {{ .Values.backup.s3.bucket | quote }}
            - name: PODDY_BACKUP_S3_PREFIX
              value: {{ .Values.backup.s3.prefix | quote }}
            - name: PODDY_BACKUP_S3_USE_SSL
              value: {{ .Values.backup.s3.useSSL | quote }}
            - name: PODDY_BACKUP_HELPER_IMAGE
              value: {{ .Values.backup.helperImage | quote }}
            - name: PODDY_BACKUP_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "poddy.backupSecretName" . }}
                  key: {{ .Values.backup.s3.accessKeyKey }}
            - name: PODDY_BACKUP_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "poddy.backupSecretName" . }}
                  key: {{ .Values.backup.s3.secretKeyKey }}
            {{- end }}
            {{- if .Values.regionManager.enabled }}
            - name: PODDY_REGION_MODE
              value: "true"
            - name: PODDY_REGION_NAME
              value: {{ .Values.regionManager.name | quote }}
            - name: PODDY_REGION_HUB_URL
              value: {{ .Values.regionManager.hubUrl | quote }}
            - name: PODDY_REGION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "poddy.regionKeySecretName" . }}
                  key: {{ .Values.regionManager.keyKey }}
            {{- end }}
            {{- if or .Values.regions .Values.regionsExistingSecret }}
            - name: PODDY_REGIONS_FILE
              value: /etc/poddy/regions/{{ .Values.regionsKey }}
            {{- end }}
            {{- if or .Values.desktop.secret .Values.desktop.existingSecret }}
            - name: PODDY_DESKTOP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "poddy.desktopSecretName" . }}
                  key: {{ .Values.desktop.secretKey }}
            {{- end }}
            {{- if or .Values.database.url .Values.database.existingSecret }}
            - name: PODDY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "poddy.databaseSecretName" . }}
                  key: {{ .Values.database.urlKey }}
            - name: PODDY_DATABASE_AUTO_MIGRATE
              value: {{ .Values.database.autoMigrate | quote }}
            - name: PODDY_DATABASE_CONNECT_TIMEOUT
              value: {{ .Values.database.connectTimeout | quote }}
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - name: PODDY_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            {{- with .Values.oidc.discoveryUrl }}
            - name: PODDY_OIDC_DISCOVERY_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.authorizationUrl }}
            - name: PODDY_OIDC_AUTHORIZATION_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.oidc.existingSecret }}
            - name: PODDY_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.existingSecret }}
                  key: {{ .Values.oidc.clientIdKey }}
            - name: PODDY_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.existingSecret }}
                  key: {{ .Values.oidc.clientSecretKey }}
            - name: PODDY_OIDC_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.existingSecret }}
                  key: {{ .Values.oidc.sessionKeyKey }}
            {{- else }}
            - name: PODDY_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            {{- with .Values.oidc.clientSecret }}
            - name: PODDY_OIDC_CLIENT_SECRET
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.sessionKey }}
            - name: PODDY_OIDC_SESSION_KEY
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: PODDY_OIDC_SCOPES
              value: {{ .Values.oidc.scopes | quote }}
            {{- with .Values.oidc.redirectUrl }}
            - name: PODDY_OIDC_REDIRECT_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.allowedGroups }}
            - name: PODDY_OIDC_ALLOWED_GROUPS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.oidc.allowedUsers }}
            - name: PODDY_OIDC_ALLOWED_USERS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: PODDY_OIDC_USERNAME_CLAIM
              value: {{ .Values.oidc.usernameClaim | quote }}
            - name: PODDY_OIDC_EMAIL_CLAIM
              value: {{ .Values.oidc.emailClaim | quote }}
            - name: PODDY_OIDC_GROUPS_CLAIM
              value: {{ .Values.oidc.groupsClaim | quote }}
            - name: PODDY_OIDC_SESSION_TTL
              value: {{ .Values.oidc.sessionTtl | quote }}
            {{- end }}
            {{- if .Values.externalAuth.providers }}
            - name: PODDY_EXTERNAL_AUTH_SECRET
              value: {{ include "poddy.externalAuthTokenSecretName" . | quote }}
            {{- with .Values.externalAuth.url }}
            - name: PODDY_EXTERNAL_AUTH_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.externalAuth.redirectBase }}
            - name: PODDY_EXTERNAL_AUTH_REDIRECT_BASE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.externalAuth.existingSecret }}
            - name: PODDY_EXTERNAL_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalAuth.existingSecret }}
                  key: {{ .Values.externalAuth.keyKey }}
            {{- else if .Values.externalAuth.key }}
            - name: PODDY_EXTERNAL_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "poddy.externalAuthConfigSecretName" . }}
                  key: {{ .Values.externalAuth.keyKey }}
            {{- end }}
            {{- range $i, $provider := .Values.externalAuth.providers }}
            - name: PODDY_EXTERNAL_AUTH_{{ $i }}_ID
              value: {{ $provider.id | quote }}
            {{- with $provider.type }}
            - name: PODDY_EXTERNAL_AUTH_{{ $i }}_TYPE
              value: {{ . | quote }}
            {{- end }}
            {{- with $provider.displayName }}
            - name: PODDY_EXTERNAL_AUTH_{{ $i }}_DISPLAY_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with $provider.displayIcon }}
            - name: PODDY_EXTERNAL_AUTH_{{ $i }}_DISPLAY_ICON
              value: {{ . | quote }}
            {{- end }}
            - name: PODDY_EXTERNAL_AUTH_{{ $i }}_CLIENT_ID
              value: {{ $provider.clientId | quote }}
            - name: PODDY_EXTERNAL_AUTH_{{ $i }}_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ if $provider.existingSecret }}{{ $provider.existingSecret }}{{ else if $.Values.externalAuth.existingSecret }}{{ $.Values.externalAuth.existingSecret }}{{ else }}{{ include "poddy.externalAuthConfigSecretName" $ }}{{ end }}
                  key: {{ $provider.clientSecretKey | default (printf "provider-%s-client-secret" $provider.id) }}
            {{- with $provider.authUrl }}
            - name: PODDY_EXTERNAL_AUTH_{{ $i }}_AUTH_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $provider.tokenUrl }}
            - name: PODDY_EXTERNAL_AUTH_{{ $i }}_TOKEN_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $provider.validateUrl }}
            - name: PODDY_EXTERNAL_AUTH_{{ $i }}_VALIDATE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $provider.revokeUrl }}
            - name: PODDY_EXTERNAL_AUTH_{{ $i }}_REVOKE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $provider.redirectUrl }}
            - name: PODDY_EXTERNAL_AUTH_{{ $i }}_REDIRECT_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $provider.scopes }}
            - name: PODDY_EXTERNAL_AUTH_{{ $i }}_SCOPES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with $provider.regex }}
            - name: PODDY_EXTERNAL_AUTH_{{ $i }}_REGEX
              value: {{ . | quote }}
            {{- end }}
            {{- with $provider.username }}
            - name: PODDY_EXTERNAL_AUTH_{{ $i }}_USERNAME
              value: {{ . | quote }}
            {{- end }}
            {{- with $provider.env }}
            - name: PODDY_EXTERNAL_AUTH_{{ $i }}_ENV
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if hasKey $provider "pkce" }}
            - name: PODDY_EXTERNAL_AUTH_{{ $i }}_PKCE
              value: {{ $provider.pkce | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.ssh.enabled }}
            - name: PODDY_SSH_KEYS_FILE
              value: /etc/poddy/authorized_keys
            - name: PODDY_SSH_ALLOW_UNMAPPED_KEYS
              value: {{ .Values.ssh.allowUnmappedKeys | quote }}
            {{- end }}
            {{- if and .Values.ssh.enabled .Values.ssh.agent.enabled }}
            - name: PODDY_AGENT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "poddy.agentSecretName" . }}
                  key: agent-key
            {{- end }}
            {{- if .Values.ssh.enabled }}
            - name: PODDY_SSH_CA_KEY_FILE
              value: /etc/poddy/ssh-ca/{{ .Values.ssh.ca.keyKey }}
            - name: PODDY_SSH_CERT_TTL
              value: {{ .Values.ssh.certTtl | quote }}
            {{- end }}
            {{- with .Values.vscodeExtension.id }}
            - name: PODDY_VSCODE_EXTENSION_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.vscodeExtension.version }}
            - name: PODDY_VSCODE_EXTENSION_VERSION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.vscodeExtension.releaseUrl }}
            - name: PODDY_VSCODE_EXTENSION_RELEASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.vscodeExtension.downloadUrl }}
            - name: PODDY_VSCODE_EXTENSION_DOWNLOAD_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if $metricsEnabled }}
            - name: metrics
              containerPort: {{ $metricsPort }}
              protocol: TCP
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.ssh.enabled }}
            - name: ssh-keys
              mountPath: /etc/poddy/authorized_keys
              subPath: {{ .Values.ssh.keysSecretKey }}
              readOnly: true
            - name: ssh-ca
              mountPath: /etc/poddy/ssh-ca
              readOnly: true
            {{- end }}
            {{- if or .Values.regions .Values.regionsExistingSecret }}
            - name: regions
              mountPath: /etc/poddy/regions
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if .Values.ssh.enabled }}
        - name: ssh-keys
          {{- if .Values.ssh.existingKeysSecret }}
          secret:
            secretName: {{ .Values.ssh.existingKeysSecret }}
          {{- else }}
          configMap:
            name: {{ include "poddy.sshKeysName" . }}
          {{- end }}
        - name: ssh-ca
          secret:
            secretName: {{ include "poddy.sshCASecretName" . }}
            defaultMode: 0444
        {{- end }}
        {{- if or .Values.regions .Values.regionsExistingSecret }}
        - name: regions
          secret:
            secretName: {{ include "poddy.regionsSecretName" . }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- else if gt (int .Values.replicaCount) 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "poddy.selectorLabels" . | nindent 14 }}
      {{- end }}
