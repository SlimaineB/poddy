{{- if and .Values.createWorkspaceNamespace .Values.workspaceNamespace (ne .Values.workspaceNamespace .Release.Namespace) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.workspaceNamespace }}
  labels:
    {{- include "poddy.labels" . | nindent 4 }}
    {{- with .Values.networkPolicy.workspace.psa }}
    {{- with .warn }}
    pod-security.kubernetes.io/warn: {{ . | quote }}
    {{- end }}
    {{- with .audit }}
    pod-security.kubernetes.io/audit: {{ . | quote }}
    {{- end }}
    {{- with .enforce }}
    pod-security.kubernetes.io/enforce: {{ . | quote }}
    {{- end }}
    {{- end }}
{{- end }}
