# Number of portal replicas. The portal is stateless and can be scaled
# independently from the SSH bastion.
replicaCount: 1

# SSH bastion. Runs as its own Deployment and Service so it can scale on
# connection load without scaling the portal. Set ssh.existingHostKeySecret
# before scaling above 1 replica.
bastion:
  enabled: true
  replicaCount: 1
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  # Namespace-scoped Role with only pod read and port-forward access.
  rbac:
    create: true
  resources: {}
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  extraArgs: []
  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # When empty, replicaCount > 1 spreads bastions across nodes with
  # ScheduleAnyway. Set this to enforce zone/host policies in production.
  topologySpreadConstraints: []
  probes:
    readiness:
      initialDelaySeconds: 2
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 6
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 3
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

image:
  repository: ghcr.io/your-org/poddy
  tag: latest
  pullPolicy: IfNotPresent

# Optional PostgreSQL metadata mirror and audit log. When a connection string
# is configured, the portal mirrors RBAC, users, templates, workspaces, and
# quotas into PostgreSQL and records audit events. Kubernetes remains the
# runtime source of truth. The portal exits if PostgreSQL is configured but
# unreachable at startup; later sync and audit failures are logged without
# blocking workspace operations.
database:
  # PostgreSQL connection string, for example:
  # postgres://poddy:secret@postgres:5432/poddy?sslmode=require
  # Prefer existingSecret in production.
  url: ""
  # Existing Secret in the release namespace containing the connection string
  # at database.urlKey. Set either url or existingSecret, not both.
  existingSecret: ""
  urlKey: database-url
  # Apply the embedded schema migrations on startup. Disable when migrations
  # are managed externally.
  autoMigrate: true

# Workspace volume backups to S3-compatible object storage. When enabled, the
# portal creates a short-lived helper pod that mounts a stopped workspace volume
# and streams a gzip tar archive to the bucket. The helper pod uses the same
# service account and namespace permissions as the portal.
backup:
  enabled: false
  # Image used by temporary backup/restore pods. It must contain sh, tar, and
  # gzip (busybox is sufficient).
  helperImage: busybox:1.36
  s3:
    # Endpoint without a scheme, for example minio.example.com:9000 or
    # s3.us-east-1.amazonaws.com. A scheme is accepted and controls useSSL.
    endpoint: ""
    region: ""
    bucket: ""
    prefix: poddy-backups
    useSSL: true
    # Prefer existingSecret in production. It must contain accessKeyKey and
    # secretKeyKey in the release namespace.
    existingSecret: ""
    accessKeyKey: access-key
    secretKeyKey: secret-key
    # Inline credentials are only used when existingSecret is empty. They are
    # stored in a chart-managed Secret.
    accessKey: ""
    secretKey: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Namespace-scoped permissions for the portal: workspace pods, exec,
# port-forward, PVCs, ConfigMaps and Secrets. The Role is created in
# workspaceNamespace, not necessarily in the release namespace.
rbac:
  create: true
  # ConfigMap used for global admins, teams and template assignments.
  # Defaults to "<fullname>-rbac".
  configMapName: ""
  # Seed the ConfigMap on install. The portal writes runtime changes to it, so
  # either manage access only through the UI or set createConfigMap=false after
  # the initial install to avoid helm upgrade overwriting assignments.
  createConfigMap: true
  admins: []
  # Auditors can read the audit trail but cannot change workspaces, templates,
  # teams, or RBAC.
  auditors: []
  # teams:
  #   backend:
  #     members:
  #       - alice@example.com
  #       - group:backend
  #     quota:
  #       maxWorkspaces: 5
  #       cpu: "4"
  #       memory: "8Gi"
  #       storage: "50Gi"
  teams: {}
  # Per-user overrides. Team quotas are defaults; user values win field by field.
  # userQuotas:
  #   alice@example.com:
  #     maxWorkspaces: 2
  #     cpu: "2"
  #     memory: "4Gi"
  #     storage: "20Gi"
  userQuotas: {}
  # templates:
  #   go:
  #     owners:
  #       - dev@example.com
  #     users:
  #       - alice@example.com
  #     teams:
  #       - backend
  templates: {}
  extraRules: []

# Namespace where workspace pods and PVCs are created. Defaults to the Helm
# release namespace. Set this to a dedicated team namespace to isolate teams.
workspaceNamespace: ""
createWorkspaceNamespace: false

# ConfigMap used to remember stopped workspace specs (stop/start). The portal
# creates it on first use. Defaults to "<fullname>-state".
workspaceState:
  configMapName: ""

# Central hub only. Each entry is mounted as a YAML regions file and points the
# hub at a region manager's portal Service. Prefer regionsExistingSecret in
# production: it must contain regions.yaml with the same structure.
regions: []
# - name: eu
#   displayName: Europe
#   url: http://poddy-eu.poddy-eu.svc.cluster.local
#   key: a-long-random-region-key
#   sshHost: ssh.eu.example.com
#   sshPort: 2222
#   lat: 50.1109
#   lon: 8.6821
#   default: true
regionsExistingSecret: ""
regionsKey: regions.yaml

# Region manager only. Enable this in each region cluster. The region manager
# trusts signed identities from the central hub and must not be exposed without
# network controls.
regionManager:
  enabled: false
  name: ""
  hubUrl: ""
  key: ""
  existingSecret: ""
  keyKey: region-key

# Stable key for signed VS Code desktop tickets. Required for replicaCount > 1
# when OIDC and external auth do not provide a stable key.
desktop:
  secret: ""
  existingSecret: ""
  secretKey: desktop-secret

# runtime changes to the ConfigMap, so manage them from the UI or seed them here.
auth:
  # Shared access token. Optional when oidc.enabled=true.
  #
  # The token has a single identity ("token"). It is suitable for local use or
  # automation, not for a team: enable OIDC for per-user workspaces and SSH.
  token: ""
  # Treat the shared token as a global administrator. Keep false in
  # multi-user deployments; a shared admin token can access every workspace.
  tokenAdmin: false
  # Use an existing Secret instead of creating one. The Secret must live in the
  # release namespace and contain auth.secretKey.
  existingSecret: ""
  secretKey: token

# OpenID Connect login. When enabled, users sign in through the provider and
# the shared token (if set) remains available for API automation.
oidc:
  enabled: false
  issuer: ""
  clientId: ""
  clientSecret: ""
  # Use an existing Secret in the release namespace instead of putting secrets
  # in values. It must contain oidc.clientIdKey, oidc.clientSecretKey and
  # oidc.sessionKeyKey.
  existingSecret: ""
  clientIdKey: oidc-client-id
  clientSecretKey: oidc-client-secret
  sessionKeyKey: oidc-session-key
  # Callback URL. Required behind an ingress unless X-Forwarded-Proto/Host are
  # set; e.g. https://poddy.example.com/oidc/callback.
  redirectUrl: ""
  scopes: "openid,profile,email,groups"
  # Restrict access to these groups/users. Empty allows any authenticated user.
  allowedGroups: []
  allowedUsers: []
  usernameClaim: preferred_username
  emailClaim: email
  groupsClaim: groups
  # Random key used to sign sessions. Set a stable value (or existingSecret)
  # when running more than one replica.
  sessionKey: ""
  sessionTtl: 12h

# External OAuth2 providers for Git and other workspace credentials. The
# portal injects access tokens into matching workspace templates and refreshes
# them server-side. Tokens are stored in a Secret, encrypted with key.
externalAuth:
  # Public portal URL reachable from workspace pods. When empty, the URL is
  # captured when the workspace is created.
  url: ""
  # Public base URL for OAuth callbacks behind a proxy. When empty, it is
  # derived from the request (honours X-Forwarded-Proto/Host).
  redirectBase: ""
  # Encrypts stored tokens and signs workspace tokens. Set a stable random
  # value, or use existingSecret. Required for replicaCount > 1.
  key: ""
  # Existing Secret containing keyKey. Provider client secrets can use the same
  # Secret with key "provider-<id>-client-secret" unless overridden per provider.
  existingSecret: ""
  keyKey: external-auth-key
  # Secret where per-user tokens are stored. Defaults to "<fullname>-external-auth".
  # The portal creates it on first use; it must not be the same Secret as the
  # configuration Secret above.
  tokenSecretName: ""
  # Example:
  # providers:
  #   - id: github
  #     type: github
  #     displayName: GitHub
  #     clientId: Iv1.abc123
  #     clientSecret: ""          # prefer existingSecret
  #     existingSecret: ""        # defaults to externalAuth.existingSecret
  #     clientSecretKey: ""       # defaults to provider-<id>-client-secret
  #     scopes: [repo, read:user, user:email]
  providers: []

ssh:
  # Enables the bastion Deployment and the SSH/VS Code options in the UI.
  enabled: true
  # Listen address inside the bastion container.
  addr: ":2222"
  # Hostname or IP users connect to. Required when ssh.enabled=true.
  publicHost: ""
  publicPort: 2222
  # Optional administrator-managed SSH keys. The key comment binds a key to
  # its owner: "alice@example.com" or "user:alice@example.com". Use "admin" or
  # "*" for break-glass keys that may access every workspace. Unmapped keys are
  # denied.
  #
  # For a normal team, leave this empty and let users add their own public key
  # from the portal ("SSH keys"). Self-service keys are bound to the signed-in
  # OIDC identity and can never be assigned to another user by a comment.
  authorizedKeys: []
  # Legacy escape hatch: allow keys without an owner comment to access every
  # workspace. Keep false in production.
  allowUnmappedKeys: false
  # Use an existing Secret instead of creating a ConfigMap. The Secret must be
  # in the release namespace and contain ssh.keysSecretKey.
  existingKeysSecret: ""
  keysSecretKey: authorized_keys
  # Recommended for production. The Secret must contain a private host key at
  # ssh.hostKeySecretKey. Required when bastion.replicaCount > 1.
  existingHostKeySecret: ""
  hostKeySecretKey: ssh_host_ed25519_key
  service:
    type: LoadBalancer
    port: 2222
    # Optional fixed NodePort (30000-32767). Useful when LoadBalancer is not
    # available or when the node already uses 2222.
    nodePort: 0
    annotations: {}
    loadBalancerIP: ""
    externalTrafficPolicy: ""

http:
  service:
    type: ClusterIP
    port: 80
    # Optional fixed NodePort (30000-32767); only for type NodePort/LoadBalancer.
    nodePort: 0

# Prometheus metrics are served on a separate listener so they are never
# exposed through the portal ingress. The metrics Service is always ClusterIP.
metrics:
  enabled: true
  service:
    port: 9090
    annotations: {}
  # Requires the Prometheus Operator CRDs. Enable only if the cluster has them.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    relabelings: []
    metricRelabelings: []

portal:
  addr: ":8080"

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: poddy.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Template used when the UI does not specify one. Must exist in the embedded
# templates or in a template ConfigMap watched by the portal.
defaultTemplate: base

# Workspace templates are managed outside this chart: use the separate
# poddy-templates chart, or apply labeled ConfigMaps with
# poddy.io/template=true. The portal watches them and reloads without restart.

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
# When empty, replicaCount > 1 spreads portal pods across nodes with
# ScheduleAnyway. Set this to enforce zone/host policies in production.
topologySpreadConstraints: []
priorityClassName: ""

# Enable for production HA. PDBs are not created automatically, and
# minAvailable must leave room for at least one healthy replica.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

extraEnv: []
extraArgs: []
extraVolumes: []
extraVolumeMounts: []
