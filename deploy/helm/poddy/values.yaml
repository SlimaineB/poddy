# Number of portal replicas. The portal is stateless and can be scaled
# independently from the SSH bastion.
replicaCount: 1

# SSH bastion. Runs as its own Deployment and Service so it can scale on
# connection load without scaling the portal. Set ssh.existingHostKeySecret
# before scaling above 1 replica.
bastion:
  enabled: true
  replicaCount: 1
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  # Namespace-scoped Role with pod read, port-forward, and access approval
  # state access.
  rbac:
    create: true
  resources: {}
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  extraArgs: []
  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # When empty, replicaCount > 1 spreads bastions across nodes with
  # ScheduleAnyway. Set this to enforce zone/host policies in production.
  topologySpreadConstraints: []
  # New SSH connections are rejected as soon as SIGTERM arrives. The listener
  # then stays open for drainDelay so Kubernetes can remove the endpoint before
  # it closes.
  drainDelay: 3s
  # Existing SSH sessions stay alive during a graceful pod shutdown for this
  # long. Keep drainDelay + drainTimeout below terminationGracePeriodSeconds.
  drainTimeout: 20s
  terminationGracePeriodSeconds: 30
  # Treat a new bastion as available only after it has been ready for this long.
  minReadySeconds: 5
  probes:
    readiness:
      initialDelaySeconds: 2
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 6
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 3
  # Created automatically when replicaCount > 1. Set enabled=false to opt out.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow

image:
  repository: ghcr.io/your-org/poddy
  tag: latest
  pullPolicy: IfNotPresent

# Client-side rate limits for the Kubernetes API. client-go defaults to 5 QPS
# with a burst of 10, which throttles busy portals and makes terminals and
# VS Code port forwards feel slow. Set qps to 0 to keep the client default.
kubernetes:
  qps: 50
  burst: 100

# PostgreSQL control plane. Required for the portal and bastion unless
# regionManager.enabled=true (regions use the hub instead). PostgreSQL stores
# RBAC, users, quotas, access grants, audit events, shares, external auth
# tokens, and environment variables/secrets.
database:
  # PostgreSQL connection string, for example:
  # postgres://poddy:secret@postgres:5432/poddy?sslmode=require
  # Prefer existingSecret in production.
  url: ""
  # Existing Secret in the release namespace containing the connection string
  # at database.urlKey. Set either url or existingSecret, not both.
  existingSecret: ""
  urlKey: database-url
  # Apply the embedded schema migrations on startup. Disable when migrations
  # are managed externally.
  autoMigrate: true
  # How long to retry before failing startup.
  connectTimeout: 30s

# Workspace volume backups to S3-compatible object storage. When enabled, the
# portal creates a short-lived helper pod that mounts a stopped workspace volume
# and streams a gzip tar archive to the bucket. The helper pod uses the same
# service account and namespace permissions as the portal.
backup:
  enabled: false
  # Image used by temporary backup/restore pods. It must contain sh, tar, and
  # gzip (busybox is sufficient).
  helperImage: docker.io/library/busybox:1.36
  s3:
    # Endpoint without a scheme, for example minio.example.com:9000 or
    # s3.us-east-1.amazonaws.com. A scheme is accepted and controls useSSL.
    endpoint: ""
    region: ""
    bucket: ""
    prefix: poddy-backups
    useSSL: true
    # Prefer existingSecret in production. It must contain accessKeyKey and
    # secretKeyKey in the release namespace.
    existingSecret: ""
    accessKeyKey: access-key
    secretKeyKey: secret-key
    # Inline credentials are only used when existingSecret is empty. They are
    # stored in a chart-managed Secret.
    accessKey: ""
    secretKey: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Namespace-scoped permissions for the portal: workspace pods, exec,
# port-forward, PVCs, ConfigMaps and Secrets. The Role is created in
# workspaceNamespace, not necessarily in the release namespace.
rbac:
  create: true
  # ConfigMap used for global admins, teams and template assignments.
  # Defaults to "<fullname>-rbac".
  configMapName: ""
  # Seed the ConfigMap on install. The portal writes runtime changes to it, so
  # either manage access only through the UI or set createConfigMap=false after
  # the initial install to avoid helm upgrade overwriting assignments.
  createConfigMap: true
  admins: []
  # Auditors can read the audit trail but cannot change workspaces, templates,
  # teams, or RBAC.
  auditors: []
  # teams:
  #   backend:
  #     members:
  #       - alice@example.com
  #       - group:backend
  #     quota:
  #       maxWorkspaces: 5
  #       cpu: "4"
  #       memory: "8Gi"
  #       storage: "50Gi"
  teams: {}
  # Per-user overrides. Team quotas are defaults; user values win field by field.
  # userQuotas:
  #   alice@example.com:
  #     maxWorkspaces: 2
  #     cpu: "2"
  #     memory: "4Gi"
  #     storage: "20Gi"
  userQuotas: {}
  # templates:
  #   go:
  #     owners:
  #       - dev@example.com
  #     users:
  #       - alice@example.com
  #     teams:
  #       - backend
  templates: {}
  extraRules: []

# Namespace where workspace pods and PVCs are created. Defaults to the Helm
# release namespace. Set this to a dedicated team namespace to isolate teams.
workspaceNamespace: ""
createWorkspaceNamespace: false

# Network isolation for workspace pods. The default policy denies all ingress
# and egress, then allows DNS, reaches the portal/bastion, and (optionally)
# public internet access with private, CGNAT and IMDS ranges excluded.
networkPolicy:
  enabled: true
  workspace:
    # Allow the portal and bastion to reach workspace ports. Direct browser
    # access still goes through the portal, so no ingress controller rule is
    # needed.
    allowPortal: true
    egress:
      # Allow CoreDNS in kube-system.
      allowDNS: true
      dnsNamespace: kube-system
      # Allow the workspace agent and external-auth helper to reach the
      # portal/bastion in the release namespace on their control-plane ports.
      allowControlPlane: true
      # Allow public internet egress while blocking RFC1918, CGNAT and
      # link-local ranges (including the cloud metadata endpoint).
      allowInternet: true
      # Additional allowed destination CIDRs, for example an internal package
      # mirror or a database outside the cluster.
      allowedCIDRs: []
      # Additional allowed destination namespaces. Workspace access to the
      # database is intentionally not enabled by default.
      allowedNamespaces: []
      # Additional DNS endpoints such as NodeLocal DNSCache
      # (169.254.20.10/32). Metadata endpoints must never be added here.
      dnsCIDRs: []
    # Pod Security Admission labels applied when the chart creates the
    # workspace namespace. Baseline is only advisory here because workspace
    # containers need SYS_RESOURCE for sshd OOM protection.
    psa:
      warn: baseline
      audit: baseline

# Legacy stopped-workspace ConfigMap, read only for migration. Workspaces are
# stored as StatefulSets, so new installs can leave this empty.
workspaceState:
  configMapName: ""

# Defaults applied to workspace pods. Template parameters still win.
dotfiles:
  # Portal-wide fallback Git repository for users who have not configured
  # their own dotfiles. The repository is cloned at workspace startup and its
  # top-level entries are copied into /home/dev; .ssh is never overwritten.
  url: ""
  # Branch for the fallback repository. Empty uses main.
  branch: ""

workspace:
  # Default StorageClass for workspace home volumes when the template leaves
  # its storageClass parameter empty. Empty uses the cluster default.
  storageClass: ""
  # Registry mirror for workspace and sidecar images. The registry must expose
  # the same image paths, for example mirror.example.com/slimaineb/....
  imageRegistry: ""
  # Optional per-registry mirror map. Keys are source registry hosts
  # (ghcr.io, docker.io, localhost:5000, or "*"); values are target prefixes.
  # Exact host wins, then "*", then imageRegistry. An empty value leaves that
  # host untouched.
  imageRegistryMap: {}
  # Existing image pull Secrets in the workspace namespace, applied to every
  # workspace pod. Use this for a private registry mirror.
  imagePullSecrets: []

# Central hub only. Each entry is mounted as a YAML regions file and points the
# hub at a region manager's portal Service. Prefer regionsExistingSecret in
# production: it must contain regions.yaml with the same structure. When regions
# are configured, the hub relays region SSH through the outbound region tunnel;
# sshHost/sshPort are then optional and only used when relay is disabled.
regions: []
# - name: eu
#   displayName: Europe
#   key: a-long-random-region-key
#   sshHost: ssh.eu.example.com
#   sshPort: 2222
#   lat: 50.1109
#   lon: 8.6821
#   default: true
regionsExistingSecret: ""
regionsKey: regions.yaml

# Region manager only. Enable this in each region cluster. The region manager
# opens an outbound tunnel to hubUrl and trusts signed identities from the hub.
regionManager:
  enabled: false
  name: ""
  hubUrl: ""
  key: ""
  existingSecret: ""
  keyKey: region-key

# Stable key for signed VS Code desktop tickets. Required for replicaCount > 1
# when OIDC and external auth do not provide a stable key.
desktop:
  secret: ""
  existingSecret: ""
  secretKey: desktop-secret

# runtime changes to the ConfigMap, so manage them from the UI or seed them here.
auth:
  # Shared access token. Optional when oidc.enabled=true.
  #
  # The token has a single identity ("token"). It is suitable for local use or
  # automation, not for a team: enable OIDC for per-user workspaces and SSH.
  token: ""
  # Treat the shared token as a global administrator. Keep false in
  # multi-user deployments; a shared admin token can access every workspace.
  tokenAdmin: false
  # Use an existing Secret instead of creating one. The Secret must live in the
  # release namespace and contain auth.secretKey.
  existingSecret: ""
  secretKey: token

# OpenID Connect login. When enabled, users sign in through the provider and
# the shared token (if set) remains available for API automation.
oidc:
  enabled: false
  # Expected issuer (the iss claim). This is separate from the callback URL.
  issuer: ""
  # Optional discovery URL when the issuer is only reachable from the browser
  # or discovery must use an internal endpoint. Defaults to issuer.
  discoveryUrl: ""
  # Optional browser-facing authorization endpoint override. Use when the
  # discovery document advertises an internal authorization endpoint.
  authorizationUrl: ""
  clientId: ""
  clientSecret: ""
  # Use an existing Secret in the release namespace instead of putting secrets
  # in values. It must contain oidc.clientIdKey, oidc.clientSecretKey and
  # oidc.sessionKeyKey.
  existingSecret: ""
  clientIdKey: oidc-client-id
  clientSecretKey: oidc-client-secret
  sessionKeyKey: oidc-session-key
  # Callback URL. Required behind an ingress unless X-Forwarded-Proto/Host are
  # set; e.g. https://poddy.example.com/oidc/callback.
  redirectUrl: ""
  scopes: "openid,profile,email,groups"
  # Restrict access to these groups/users. Empty allows any authenticated user.
  allowedGroups: []
  allowedUsers: []
  usernameClaim: preferred_username
  emailClaim: email
  groupsClaim: groups
  # Random key used to sign sessions. Set a stable value (or existingSecret)
  # when running more than one replica.
  sessionKey: ""
  sessionTtl: 12h

# External OAuth2 providers for Git and other workspace credentials. The
# portal injects access tokens into matching workspace templates and refreshes
# them server-side. Tokens are stored in a Secret, encrypted with key.
externalAuth:
  # Public portal URL reachable from workspace pods. When empty, the URL is
  # captured when the workspace is created.
  url: ""
  # Public base URL for OAuth callbacks behind a proxy. When empty, it is
  # derived from the request (honours X-Forwarded-Proto/Host).
  redirectBase: ""
  # Encrypts stored tokens, share links, environment secrets, and signs
  # workspace tokens. Set a stable random value, or use existingSecret. When
  # empty, the database URL is used as the fallback key. Required for
  # replicaCount > 1.
  key: ""
  # Existing Secret containing keyKey. Provider client secrets can use the same
  # Secret with key "provider-<id>-client-secret" unless overridden per provider.
  existingSecret: ""
  keyKey: external-auth-key
  # Legacy Secret imported into PostgreSQL once when external_auth_tokens is
  # empty. Defaults to "<fullname>-external-auth"; it must not be the same
  # Secret as the configuration Secret above.
  tokenSecretName: ""
  # Example:
  # providers:
  #   - id: github
  #     type: github
  #     displayName: GitHub
  #     clientId: Iv1.abc123
  #     clientSecret: ""          # prefer existingSecret
  #     existingSecret: ""        # defaults to externalAuth.existingSecret
  #     clientSecretKey: ""       # defaults to provider-<id>-client-secret
  #     scopes: [repo, read:user, user:email]
  providers: []

ssh:
  # Enables the bastion Deployment and the SSH/VS Code options in the UI.
  enabled: true
  # Listen address inside the bastion container.
  addr: ":2222"
  # Hostname or IP users connect to. Required when ssh.enabled=true.
  publicHost: ""
  publicPort: 2222
  # Optional administrator-managed SSH keys. The key comment binds a key to
  # its owner: "alice@example.com" or "user:alice@example.com". Use "admin" or
  # "*" for break-glass keys that may access every workspace. Unmapped keys are
  # denied.
  #
  # For a normal team, leave this empty and let users add their own public key
  # from the portal ("SSH keys"). Self-service keys are bound to the signed-in
  # OIDC identity and can never be assigned to another user by a comment.
  authorizedKeys: []
  # Legacy escape hatch: allow keys without an owner comment to access every
  # workspace. Keep false in production.
  allowUnmappedKeys: false
  # Require the outbound workspace agent tunnel. When true, the bastion never
  # uses the Kubernetes port-forward API to reach workspace pods.
  requireAgent: true
  # Lifetime of short-lived user SSH certificates issued by the portal.
  certTtl: 15m
  # SSH certificate authority. The same CA is mounted into the portal (to sign
  # certificates) and the bastion (to verify them). Leave key empty to let the
  # chart generate and preserve a random key. Region clusters must use the same
  # CA (for example ssh.ca.existingSecret) for relayed SSH to be accepted.
  ca:
    existingSecret: ""
    keyKey: ssh-ca-key
    key: ""
  agent:
    enabled: true
    # Run poddy-agent in a dedicated sidecar with its own memory limit. Set
    # false to keep the legacy in-workspace agent process.
    sidecar: true
    # Image for the agent sidecar. Empty uses the portal image, which includes
    # /poddy-agent. If the image is private, add its pull Secret to
    # workspace.imagePullSecrets.
    image: ""
    # URL injected into workspace pods. Empty derives the in-cluster Service URL
    # http://<release>-agent.<namespace>.svc:<port>.
    url: ""
    port: 8091
    tokenTtl: 1h
    # HMAC key shared by the portal and the bastion. Leave empty to let the
    # chart generate and preserve a random Secret.
    key: ""
    existingSecret: ""
  # Use an existing Secret instead of creating a ConfigMap. The Secret must be
  # in the release namespace and contain ssh.keysSecretKey.
  existingKeysSecret: ""
  keysSecretKey: authorized_keys
  # Recommended for production. The Secret must contain a private host key at
  # ssh.hostKeySecretKey. Required when bastion.replicaCount > 1.
  existingHostKeySecret: ""
  hostKeySecretKey: ssh_host_ed25519_key
  service:
    # ClusterIP by default. Set LoadBalancer or NodePort explicitly when the
    # bastion must be reachable from outside the cluster, and restrict access
    # with annotations/firewall rules.
    type: ClusterIP
    port: 2222
    # Optional fixed NodePort (30000-32767) for type NodePort/LoadBalancer.
    nodePort: 0
    # Select a load balancer implementation without annotations. On EKS Auto
    # Mode use eks.amazonaws.com/nlb; with AWS Load Balancer Controller >= 2.9
    # use service.k8s.aws/nlb. Leave empty to rely on annotations or the
    # cluster default.
    loadBalancerClass: ""
    annotations: {}
    loadBalancerIP: ""
    externalTrafficPolicy: ""

http:
  service:
    type: ClusterIP
    port: 80
    # Optional fixed NodePort (30000-32767); only for type NodePort/LoadBalancer.
    nodePort: 0
    # Select a load balancer implementation without annotations. On EKS Auto
    # Mode use eks.amazonaws.com/nlb; with AWS Load Balancer Controller >= 2.9
    # use service.k8s.aws/nlb. Leave empty to rely on annotations or the
    # cluster default.
    loadBalancerClass: ""
    annotations: {}
    loadBalancerIP: ""
    externalTrafficPolicy: ""

# Prometheus metrics are served on a separate listener so they are never
# exposed through the portal ingress. The metrics Service is always ClusterIP.
metrics:
  enabled: true
  service:
    port: 9090
    annotations: {}
  # Requires the Prometheus Operator CRDs. Enable only if the cluster has them.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    relabelings: []
    metricRelabelings: []

# In-product monitoring. Every surface is independent so an installation can
# expose live usage, Prometheus history, the admin overview, or none of them.
monitoring:
  # Master switch for workspace and portal monitoring APIs and UI.
  enabled: true
  # Live CPU/memory from metrics-server in workspace details.
  live: true
  # Historical charts queried from Prometheus. Requires monitoring.prometheus.url.
  history: true
  # Admin-only portal-wide monitoring view.
  global: true
  # FinOps is disabled by default. Cost data is never shown to regular users
  # unless visibleToUsers is explicitly enabled.
  costs:
    enabled: false
    visibleToUsers: false
    # Unit prices for FinOps estimates. Leave at 0 to hide that cost line;
    # resource waste is still reported without any pricing.
    cpuCoreHour: 0
    memoryGBHour: 0
    storageGBMonth: 0
    currency: USD
  prometheus:
    # In-cluster Prometheus base URL, for example
    # http://prometheus-operated.monitoring.svc:9090
    url: ""
    # Existing Secret in the release namespace containing a bearer token.
    existingSecret: ""
    tokenKey: token

portal:
  addr: ":8080"
  # On SIGTERM the portal fails readiness, rejects new requests with 503, and
  # waits this long for endpoints to drain before closing the HTTP listener.
  shutdownDrainDelay: 3s
  # Keep this above shutdownDrainDelay plus the 10s HTTP shutdown timeout.
  terminationGracePeriodSeconds: 30

vscodeExtension:
  id: ""
  version: ""
  releaseUrl: ""
  downloadUrl: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: poddy.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Template used when the UI does not specify one. Must exist in a template
# ConfigMap watched by the portal; the portal does not embed templates.
defaultTemplate: base

# Workspace templates are managed outside this chart: install the separate
# poddy-templates chart, or apply labeled ConfigMaps with
# poddy.io/template=true. The portal watches them and reloads without restart.

podAnnotations: {}
podLabels: {}
hostAliases: []

podSecurityContext:
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
# When empty, replicaCount > 1 spreads portal pods across nodes with
# ScheduleAnyway. Set this to enforce zone/host policies in production.
topologySpreadConstraints: []
priorityClassName: ""
# Treat a new portal as available only after it has been ready for this long.
minReadySeconds: 5

# Created automatically when replicaCount > 1. Set enabled=false to opt out.
# minAvailable must leave room for at least one healthy replica.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow

extraEnv: []
extraArgs: []
extraVolumes: []
extraVolumeMounts: []
