name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "gofmt needed for:"
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: find web -name '*.js' -print0 | xargs -0 -n1 node --check

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install MkDocs Material
        run: pip install -r requirements-docs.txt
      - name: Build docs
        run: mkdocs build --strict

  helm:
    name: Helm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - name: Lint charts
        run: |
          helm lint deploy/helm/poddy \
            --set auth.token=ci-token \
            --set workspaceNamespace=poddy-workspaces \
            --set ssh.publicHost=localhost \
            --set-string 'ssh.authorizedKeys[0]=ssh-ed25519 AAAA ci@example.invalid'
          helm lint deploy/helm/poddy-templates
      - name: Render charts
        run: |
          helm template poddy deploy/helm/poddy \
            --namespace poddy-system \
            --set auth.token=ci-token \
            --set workspaceNamespace=poddy-workspaces \
            --set ssh.publicHost=localhost \
            --set-string 'ssh.authorizedKeys[0]=ssh-ed25519 AAAA ci@example.invalid' \
            >/dev/null
          helm template poddy-templates deploy/helm/poddy-templates \
            --namespace poddy-workspaces \
            >/dev/null
      - name: Render split variants
        run: |
          helm template poddy deploy/helm/poddy \
            --namespace poddy-system \
            --set auth.token=ci-token \
            --set workspaceNamespace=poddy-workspaces \
            --set ssh.enabled=false \
            >/dev/null
          helm template poddy deploy/helm/poddy \
            --namespace poddy-system \
            --set auth.token=ci-token \
            --set workspaceNamespace=poddy-workspaces \
            --set ssh.publicHost=localhost \
            --set-string 'ssh.authorizedKeys[0]=ssh-ed25519 AAAA ci@example.invalid' \
            --set ssh.existingHostKeySecret=poddy-host-key \
            --set bastion.replicaCount=2 \
            >/dev/null

  docker:
    name: Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build portal/bastion image
        run: docker build -t poddy:ci .
      - name: Build workspace images
        run: |
          docker build -f Dockerfile.workspace-base -t poddy/workspace-base:ci .
          docker build -f Dockerfile.workspace-go \
            --build-arg BASE_IMAGE=poddy/workspace-base:ci \
            -t poddy/workspace:ci .
