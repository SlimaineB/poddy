name: VS Code extension

on:
  push:
    branches: [main, master]
    paths:
      - "vscode-extension/**"
      - ".github/workflows/vscode-extension.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "vscode-extension/**"
      - ".github/workflows/vscode-extension.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Create and publish tag v<version>; must match vscode-extension/package.json"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: vscode-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package VSIX
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Read extension version
        id: version
        run: |
          version="$(node -p "require('./vscode-extension/package.json').version")"
          if [[ -z "$version" ]]; then
            echo "could not read extension version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Check JavaScript syntax
        working-directory: vscode-extension
        run: npm run check

      - name: Package VSIX
        working-directory: vscode-extension
        run: npm run package -- --out "poddy-remote-${{ steps.version.outputs.version }}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: poddy-remote-vsix-${{ steps.version.outputs.version }}
          path: vscode-extension/poddy-remote-${{ steps.version.outputs.version }}.vsix
          if-no-files-found: error
          retention-days: 30

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${INPUT_VERSION#v}"
          fi
          if [[ "$tag" != "v${VERSION}" ]]; then
            echo "tag $tag does not match extension version v${VERSION}" >&2
            exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_ENV"

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.release_tag }}
        run: |
          remote="$(git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | cut -f1 | tail -n1)"
          if [[ -n "$remote" ]]; then
            if [[ "$remote" != "$GITHUB_SHA" ]]; then
              echo "tag ${TAG} points to ${remote}, expected ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "tag ${TAG} already exists at ${GITHUB_SHA}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="${GITHUB_SHA}"
          fi

      - name: Publish VSIX to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.release_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          asset="vscode-extension/poddy-remote-${VERSION}.vsix"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" \
              --title "Poddy Remote ${TAG}" \
              --notes "Poddy Remote VS Code extension ${VERSION}"
          fi
