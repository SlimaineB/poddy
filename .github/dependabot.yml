version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docs-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/ui-tests"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      ui-test-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/vscode-extension"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      extension-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-images:
        patterns: ["*"]
