site_name: poddy
site_description: Kubernetes development workspaces with a browser UI, SSH bastion, and VS Code Remote-SSH.
site_url: https://slimaineb.github.io/poddy/
repo_url: https://github.com/SlimaineB/poddy
repo_name: SlimaineB/poddy
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Deployment:
      - Kubernetes (Helm): deploy.md
      - Local k3s test: k3s-test.md
  - Workspaces:
      - Templates: templates.md
      - External authentication: external-auth.md
      - Links: links.md
  - Access and security:
      - OIDC / SSO: oidc.md
      - RBAC and ownership: rbac.md
  - Reference:
      - Architecture: architecture.md
      - Data model: data-model.md
      - PostgreSQL metadata: postgres-schema.md
      - Development: development.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SlimaineB/poddy
      name: poddy on GitHub

extra_css:
  - assets/stylesheets/extra.css

copyright: Copyright &copy; 2026 poddy

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
