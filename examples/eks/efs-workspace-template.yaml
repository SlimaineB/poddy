# Workspace template with:
#   - an EBS-backed home volume at /workspace (per-workspace, ReadWriteOnce);
#   - a shared EFS volume at /shared/<workspace> (ReadWriteMany).
#
# Apply this in the workspace namespace:
#   kubectl apply -f examples/eks/efs-workspace-template.yaml
#
# The shared PVC is created by examples/eks/shared-efs-pvc.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: efs-workspace-template
  namespace: poddy-workspaces
  labels:
    poddy.io/template: "true"
    poddy.io/template-name: efs
    poddy.io/template-version: "1.0.0"
    poddy.io/template-active: "true"
data:
  template.yaml: |
    name: efs
    displayName: EFS shared
    description: EBS home at /workspace, shared EFS at /shared/<workspace>, and optional browser VS Code.
    image: ghcr.io/your-org/poddy-workspace-node:latest
    version: "1.0.0"
    parameters:
      - name: cpu
        description: CPU request
        default: "1"
      - name: memory
        description: Memory request
        default: 2Gi
      - name: storage
        description: Per-workspace home volume size
        default: 10Gi
      - name: storageClass
        description: StorageClass for the home volume (empty uses the cluster default)
        default: ""
      - name: browserVSCode
        description: Run VS Code in the browser (true/false)
        default: "false"
  pod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      labels:
        poddy.io/template: efs
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init-shared
          image: public.ecr.aws/docker/library/busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p "/shared/{{ .Name }}"
          volumeMounts:
            - name: shared-efs
              mountPath: /shared
      containers:
        - name: workspace
          image: {{ .Image | quote }}
          imagePullPolicy: IfNotPresent
          command: [{{ .SSHCommand | quote }}]
          env:
            - name: SSH_AUTHORIZED_KEY
              value: {{ .AuthorizedKeys | quote }}
          workingDir: {{ .WorkspacePath | quote }}
          ports:
            - name: ssh
              containerPort: 22
          resources:
            requests:
              cpu: {{ .Parameters.cpu | quote }}
              memory: {{ .Parameters.memory | quote }}
          volumeMounts:
            - name: workspace
              mountPath: {{ .WorkspacePath | quote }}
            - name: shared-efs
              mountPath: /shared
              subPath: {{ .Name | quote }}
        {{- if eq .Parameters.browserVSCode "true" }}
        - name: code-server
          image: gitpod/openvscode-server:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - exec "${OPENVSCODE_SERVER_ROOT}/bin/openvscode-server" --host 127.0.0.1 --port 3000 --without-connection-token --server-base-path "/api/workspaces/{{ .Name }}/code" --default-folder /workspace --telemetry-level off
          workingDir: /workspace
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
        {{- end }}
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ .PVCName | quote }}
        - name: shared-efs
          persistentVolumeClaim:
            claimName: poddy-shared-efs
