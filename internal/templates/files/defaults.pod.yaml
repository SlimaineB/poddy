apiVersion: v1
kind: Pod
spec:
  automountServiceAccountToken: false
  securityContext:
    fsGroup: 1000
  containers:
    - name: workspace
      image: {{ .Image | quote }}
      imagePullPolicy: IfNotPresent
      command: [{{ .SSHCommand | quote }}]
      env:
        - name: SSH_AUTHORIZED_KEY
          value: {{ .AuthorizedKeys | quote }}
      workingDir: {{ .WorkspacePath | quote }}
      ports:
        - name: ssh
          containerPort: 22
      resources:
        requests:
          {{- if .Parameters.cpu }}
          cpu: {{ .Parameters.cpu | quote }}
          {{- end }}
          {{- if .Parameters.memory }}
          memory: {{ .Parameters.memory | quote }}
          {{- end }}
      volumeMounts:
        - name: workspace
          mountPath: {{ .WorkspacePath | quote }}
    {{- if eq .Parameters.browserVSCode "true" }}
    - name: code-server
      image: gitpod/openvscode-server:latest
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - exec "${OPENVSCODE_SERVER_ROOT}/bin/openvscode-server" --host 127.0.0.1 --port 3000 --without-connection-token --server-base-path "/api/workspaces/{{ .Name }}/code" --default-folder {{ .WorkspacePath }} --telemetry-level off
      workingDir: {{ .WorkspacePath | quote }}
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      volumeMounts:
        - name: workspace
          mountPath: {{ .WorkspacePath | quote }}
    {{- end }}
    {{- if eq .Parameters.jupyterLab "true" }}
    - name: jupyterlab
      image: quay.io/jupyter/base-notebook:latest
      imagePullPolicy: IfNotPresent
      command: ["jupyter", "lab"]
      args:
        - "--ip=127.0.0.1"
        - "--port=8888"
        - "--no-browser"
        - "--ServerApp.base_url=/api/workspaces/{{ .Name }}/lab/"
        - "--ServerApp.root_dir={{ .WorkspacePath }}"
        - "--ServerApp.token="
        - "--ServerApp.password="
        - "--ServerApp.allow_remote_access=True"
        - "--ServerApp.allow_origin=*"
        - "--ServerApp.trust_xheaders=True"
      env:
        - name: HOME
          value: /tmp/jupyter
        - name: JUPYTER_CONFIG_DIR
          value: /tmp/jupyter/config
        - name: JUPYTER_DATA_DIR
          value: /tmp/jupyter/data
        - name: JUPYTER_RUNTIME_DIR
          value: /tmp/jupyter/runtime
      workingDir: {{ .WorkspacePath | quote }}
      ports:
        - name: jupyter
          containerPort: 8888
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 2Gi
      volumeMounts:
        - name: workspace
          mountPath: {{ .WorkspacePath | quote }}
    {{- end }}
  volumes:
    - name: workspace
      {{- if .Storage }}
      persistentVolumeClaim:
        claimName: {{ .PVCName | quote }}
      {{- else }}
      emptyDir: {}
      {{- end }}
