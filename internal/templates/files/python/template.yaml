name: python
displayName: Python 3.11
description: Python 3.11 workspace with pip, venv, uv, build tools, and a persistent home. Good for scripts, APIs, and automation.
image: ghcr.io/slimaineb/poddy-workspace-python:latest
parameters:
  - name: cpu
    displayName: CPU
    type: string
    description: CPU request for the workspace container.
    default: "1"
    options:
      - label: 250m (0.25 CPU)
        value: "250m"
      - label: 500m (0.5 CPU)
        value: "500m"
      - label: 1 CPU
        value: "1"
      - label: 2 CPUs
        value: "2"
      - label: 4 CPUs
        value: "4"
  - name: memory
    displayName: Memory
    type: string
    description: Memory request for the workspace container.
    default: "2Gi"
    options:
      - label: 512 MiB
        value: 512Mi
      - label: 1 GiB
        value: 1Gi
      - label: 2 GiB
        value: 2Gi
      - label: 4 GiB
        value: 4Gi
      - label: 8 GiB
        value: 8Gi
  - name: storage
    displayName: Home storage
    type: string
    description: Size of the persistent home volume.
    default: "10Gi"
    options:
      - label: Ephemeral (no persistence)
        value: ""
      - label: 5 GiB
        value: 5Gi
      - label: 10 GiB
        value: 10Gi
      - label: 20 GiB
        value: 20Gi
      - label: 50 GiB
        value: 50Gi
      - label: 100 GiB
        value: 100Gi
  - name: storageClass
    displayName: Storage class
    type: string
    description: StorageClass name (empty for the cluster default).
    default: ""
  - name: browserVSCode
    displayName: VS Code in the browser
    type: boolean
    description: Run an OpenVSCode Server sidecar and expose it from the workspace card.
    default: "true"

links:
  - name: Python docs
    url: https://docs.python.org/3.11/
    icon: external
    newTab: true
