name: node
displayName: Node.js 22
description: Node.js 22 workspace with npm, pnpm, Yarn, TypeScript, tsx, and a persistent home. Good for web apps, APIs, and frontend tooling.
image: ghcr.io/slimaineb/poddy-workspace-node:latest
parameters:
  - name: cpu
    description: CPU request (Kubernetes quantity, e.g. 1)
    default: "1"
  - name: memory
    description: Memory request (Kubernetes quantity, e.g. 2Gi)
    default: 2Gi
  - name: storage
    description: Persistent home volume size (empty for ephemeral storage)
    default: 10Gi
  - name: storageClass
    description: StorageClass name (empty for the cluster default)
    default: ""
  - name: browserVSCode
    description: Run VS Code in the browser (true/false)
    default: "true"
links:
  - name: Node.js docs
    url: https://nodejs.org/docs/latest-v22.x/api/
    icon: external
    newTab: true
