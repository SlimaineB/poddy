name: base
displayName: Base
description: Generic Linux workspace with SSH, optional browser VS Code, and a persistent home volume.
image: ghcr.io/slimaineb/poddy-workspace-base:latest
parameters:
  - name: cpu
    description: CPU request
    default: 500m
  - name: memory
    description: Memory request
    default: 1Gi
  - name: storage
    description: Persistent volume size (empty for ephemeral storage)
    default: 5Gi
  - name: storageClass
    description: StorageClass name (empty for the cluster default)
    default: ""
  - name: browserVSCode
    description: Run VS Code in the browser (true/false)
    default: "true"
