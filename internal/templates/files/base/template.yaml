name: base
displayName: Base (Debian 12)
description: Minimal Debian 12 workspace with Git, curl, sudo, SSH, and a persistent home. Start here for a clean Linux environment.
image: ghcr.io/slimaineb/poddy-workspace-base:latest
parameters:
  - name: cpu
    description: CPU request (Kubernetes quantity, e.g. 500m or 1)
    default: 500m
  - name: memory
    description: Memory request (Kubernetes quantity, e.g. 1Gi)
    default: 1Gi
  - name: storage
    description: Persistent home volume size (empty for ephemeral storage)
    default: 5Gi
  - name: storageClass
    description: StorageClass name (empty for the cluster default)
    default: ""
  - name: browserVSCode
    description: Run VS Code in the browser (true/false)
    default: "true"
